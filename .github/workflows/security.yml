# Action references are pinned; Dependabot proposes updates.
name: Dependency security
'on':
  workflow_dispatch: {}
  schedule:
  - cron: 12 5 * * 3
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.14'
    - name: Audit resolved public runtime dependencies
      run: 'python -m venv "$RUNNER_TEMP/runtime-audit"

        "$RUNNER_TEMP/runtime-audit/bin/python" -m pip install -r requirements.txt

        python -m pip install pip-audit==2.10.1

        python - <<''PY''

        import json

        import os

        from pathlib import Path

        import subprocess

        runtime = Path(os.environ["RUNNER_TEMP"]) / "runtime-audit/bin/python"

        packages = json.loads(subprocess.check_output([str(runtime), "-m", "pip", "list", "--format=json"], text=True))

        excluded = {"iranian_exchanges_sdk", "pip", "setuptools", "wheel"}

        public = [p for p in packages if p["name"].lower().replace("-", "_") not in excluded]

        target = Path(os.environ["RUNNER_TEMP"]) / "runtime-audit-requirements.txt"

        target.write_text("".join(p["name"] + "==" + p["version"] + "\n" for p in public))

        PY

        pip-audit --disable-pip --no-deps --progress-spinner off -r "$RUNNER_TEMP/runtime-audit-requirements.txt"

        '
